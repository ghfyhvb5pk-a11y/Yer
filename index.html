<body data-theme="paper">
<div class="app">

function makeInitial(){return {year:new Date().getFullYear(),title:'올해의 나를 기록하는 노트',theme:'paper',oneLine:'',categories:categorySeeds.map(c=>({id:c.id,name:c.name,emoji:c.emoji,desc:c.desc,enabled:true,questions:c.qs.map((title,i)=>({id:c.id+'_'+i,title,enabled:true,kind:'text',answer:'',rating:0,mediaIds:[]}))})),months:Array.from({length:12},(_,i)=>({month:i+1,title:'',story:'',good:'',hard:'',lesson:'',mood:'',events:[],mediaIds:[]}))};}
let state=makeInitial(),currentView='home',currentCategory='',selectedMonth=1,saveTimer=null,objectUrls=new Map();
function loadState(){try{const raw=localStorage.getItem(STORE_KEY);if(raw){const parsed=JSON.parse(raw);state={...makeInitial(),...parsed};state.categories=Array.isArray(parsed.categories)?parsed.categories:makeInitial().categories;state.months=Array.isArray(parsed.months)?parsed.months:makeInitial().months;}}catch(e){console.warn('저장 데이터 읽기 실패',e)}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));setSaveText('자동 저장됨');}catch(e){setSaveText('저장 공간이 부족해요. 백업을 권장해요.')}}
function scheduleSave(){setSaveText('저장 중…');clearTimeout(saveTimer);saveTimer=setTimeout(saveState,350);}
function setSaveText(t){const el=document.getElementById('saveStatus');if(el)el.textContent=t;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function activeCats(){return state.categories.filter(c=>c.enabled)}
function findCat(id){return state.categories.find(c=>c.id===id)}
function findQ(id){for(const c of state.categories){const q=c.questions.find(q=>q.id===id);if(q)return {cat:c,q};}return null}
function completedCount(){let n=0;for(const c of activeCats())for(const q of c.questions)if(q.enabled&&(q.answer.trim()||q.mediaIds.length||q.kind==='rating'&&q.rating))n++;for(const m of state.months)if(m.story.trim()||m.events.length||m.mediaIds.length)n++;return n;}
function totalCount(){return activeCats().reduce((n,c)=>n+c.questions.filter(q=>q.enabled).length,0)+12;}
function categoryProgress(c){const enabled=c.questions.filter(q=>q.enabled);return {done:enabled.filter(q=>q.answer.trim()||q.mediaIds.length||q.rating).length,total:enabled.length};}
function renderNav(){const root=document.getElementById('categoryNav');root.innerHTML=state.categories.map(c=>`<button class="nav-btn ${currentView==='category'&&currentCategory===c.id?'active':''}" data-view="category" data-category="${esc(c.id)}"><span class="nav-ico">${esc(c.emoji)}</span><span>${esc(c.name)}</span></button>`).join('');document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView&&(b.dataset.view!=='category'||b.dataset.category===currentCategory)));}
function render(){document.body.dataset.theme=state.theme||'paper';renderNav();const screen=document.getElementById('screen');if(currentView==='home')screen.innerHTML=renderHome();else if(currentView==='months')screen.innerHTML=renderMonths();else if(currentView==='category')screen.innerHTML=renderCategory();else if(currentView==='customize')screen.innerHTML=renderCustomize();else if(currentView==='preview')screen.innerHTML=renderPreview();document.getElementById('crumb').textContent=({home:'MY YEARBOOK / OVERVIEW',months:'MY YEARBOOK / MONTHLY JOURNAL',category:'MY YEARBOOK / CHAPTERS',customize:'MY YEARBOOK / SETTINGS',preview:'MY YEARBOOK / FINAL PAGE'})[currentView]||'MY YEARBOOK';refreshMedia();}

<div class="page-head"><div><div class="eyebrow">YOUR PERSONAL YEARBOOK</div><h1>올해의 기록을 모아볼까요?</h1><p>마음 가는 페이지부터 천천히 채우면 돼. 빈칸도 기록의 일부니까.</p></div><div class="year-pill">✦ ${esc(state.year)} YEAR</div></div>
<section class="sheet hero ruled"><div class="hero-kicker">A LITTLE BOOK OF THIS YEAR</div><h2>${esc(state.year)}<br>나의 연말결산</h2><p>${esc(state.title)}<br>덕질도, 일상도, 사소한 사건도 전부 모아두는 나만의 아카이브.</p><div class="hero-meta"><span class="soft-pill">✎ 노트형 에디션</span><span class="soft-pill">12개월 기록</span><span class="soft-pill">사진 · 오디오 첨부</span></div></section>
<div class="stat-grid"><div class="stat"><div class="stat-label">작성한 기록</div><div class="stat-value">${done}<small style="font-size:14px;color:var(--muted)"> / ${total}</small></div></div><div class="stat"><div class="stat-label">사용 중인 카테고리</div><div class="stat-value">${activeCats().length}<small style="font-size:14px;color:var(--muted)"> 개</small></div></div><div class="stat"><div class="stat-label">전체 진행률</div><div class="stat-value">${pct}<small style="font-size:14px;color:var(--muted)">%</small></div></div></div>
<div class="spread"><div><div class="progress-label">YEAR IN REVIEW · ${pct}%</div><div class="progress-wrap" style="margin-top:8px;width:min(330px,70vw)"><i style="width:${pct}%"></i></div></div><button class="btn primary" data-view="preview">완성본 미리보기 ↗</button></div>
<div class="section-title"><div><h2>나의 챕터</h2><p>원하는 주제만 골라 열고, 필요 없는 질문은 숨겨도 돼.</p></div><button class="btn soft" data-view="customize">챕터 편집</button></div>
<div class="category-grid">${cats.map(c=>{const p=categoryProgress(c);const percent=p.total?Math.round(p.done/p.total*100):0;return `<button class="category-card" data-view="category" data-category="${esc(c.id)}" style="${c.enabled?'':'opacity:.5'}"><div class="cat-top"><div class="cat-emoji">${esc(c.emoji)}</div><div class="cat-progress">${c.enabled?p.done+'/'+p.total+' 작성':'숨김'}</div></div><div><div class="cat-name">${esc(c.name)}</div><div class="cat-bottom"><i style="width:${c.enabled?percent:0}%"></i></div></div></button>`}).join('')}</div>
<div class="section-title"><div><h2>올해를 한 문장으로</h2><p>완성본 맨 위에 들어갈 나만의 문장.</p></div></div><section class="sheet sheet-inner"><textarea class="field" style="min-height:90px" data-state="oneLine" placeholder="예: 어수선했지만 결국 나를 조금 더 좋아하게 된 해.">${esc(state.oneLine)}</textarea></section>`;}
function renderCategory(){const c=findCat(currentCategory)||activeCats()[0];if(!c)return `<div class="sheet sheet-inner"><h2>아직 챕터가 없어요</h2><button class="btn primary" data-view="customize">카테고리 만들기</button></div>`;const enabled=c.questions.filter(q=>q.enabled);const done=enabled.filter(q=>q.answer.trim()||q.mediaIds.length||q.rating).length;return `<div class="page-head"><div><div class="eyebrow">CHAPTER / ${esc(c.id.toUpperCase())}</div><h1>${esc(c.emoji)} ${esc(c.name)}</h1><p>${esc(c.desc||'나만의 기록을 남겨보세요.')}</p></div><div class="year-pill">${done} / ${enabled.length} 작성</div></div>

function showModal(title,body,buttons){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" onclick="event.stopPropagation()"><div class="modal-head"><h3>${esc(title)}</h3><button class="tiny-btn" data-action="close-modal">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${buttons||'<button class="btn ghost" data-action="close-modal">닫기</button>'}</div></div></div>`;const first=root.querySelector('input,textarea,select');if(first)setTimeout(()=>first.focus(),50);}
function renderMediaItem(id,blob){const url=URL.createObjectURL(blob);objectUrls.set(id,url);const type=blob.type||'';let html='';if(type.startsWith('image/'))html=`<div class="media-item"><img src="${url}" alt="첨부 이미지"><button class="media-remove" data-action="remove-media" data-media="${esc(id)}">×</button><div class="media-name">${esc(blob.name||'사진')}</div></div>`;else if(type.startsWith('audio/'))html=`<div class="media-item"><audio controls src="${url}" preload="metadata"></audio><button class="media-remove" data-action="remove-media" data-media="${esc(id)}">×</button><div class="media-name">♫ ${esc(blob.name||'오디오')}</div></div>`;else html=`<div class="media-item"><div class="media-name">첨부 파일</div><button class="media-remove" data-action="remove-media" data-media="${esc(id)}">×</button></div>`;return html;}
function refreshMedia(){document.querySelectorAll('[data-media-list]').forEach(async box=>{const marker=box.dataset.mediaList;let ids=[];if(box.dataset.mediaIds){try{ids=JSON.parse(box.dataset.mediaIds)}catch{}}else{const [type,id]=marker.split(':');const target=getTarget(type,id);ids=target?.mediaIds||[];}if(!ids.length){if(!box.innerHTML.trim())box.innerHTML='';return;}const existing=box.dataset.loadedIds||'';if(existing===ids.join(','))return;box.dataset.loadedIds=ids.join(',');let html='';for(const id of ids){try{const blob=await mediaGet(id);if(blob)html+=renderMediaItem(id,blob)}catch{}}if(box.isConnected)box.innerHTML=html||'<div class="empty-note">파일을 불러오지 못했어요.</div>';});}
function getTarget(type,id){if(type==='question'){const found=findQ(id);return found?.q;}if(type==='month')return state.months.find(m=>m.month===Number(id));if(type==='event'){for(const m of state.months){const e=m.events.find(e=>e.id===id);if(e)return e;}}return null;}
// IndexedDB keeps large media out of localStorage.
let dbPromise=null;function openDB(){if(!('indexedDB'in window))return Promise.reject(new Error('IndexedDB unavailable'));if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('yearbook_note_media',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('media'))db.createObjectStore('media',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});return dbPromise;}
async function mediaPut(id,blob,name){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').put({id,blob,name,type:blob.type});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
async function mediaGet(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('media','readonly');const req=tx.objectStore('media').get(id);req.onsuccess=()=>resolve(req.result?.blob||null);req.onerror=()=>reject(req.error);});}
async function mediaDelete(id){try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}catch(e){}if(objectUrls.has(id)){URL.revokeObjectURL(objectUrls.get(id));objectUrls.delete(id);}}
function moveItem(arr,id,dir){const i=arr.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];}

async function attachFiles(type,id,accept,files){const target=getTarget(type,id);if(!target)return;const selected=[...files].filter(f=>accept==='image'?f.type.startsWith('image/'):accept==='audio'?f.type.startsWith('audio/'):(f.type.startsWith('image/')||f.type.startsWith('audio/')));for(const file of selected){const mediaId=uid();try{await mediaPut(mediaId,file,file.name);target.mediaIds=target.mediaIds||[];target.mediaIds.push(mediaId);}catch(e){alert('파일을 저장하지 못했어. 브라우저 저장 공간 권한이나 여유 공간을 확인해줘.');}}scheduleSave();render();}
async function removeMedia(id){for(const c of state.categories)for(const q of c.questions)q.mediaIds=q.mediaIds.filter(x=>x!==id);for(const m of state.months){m.mediaIds=m.mediaIds.filter(x=>x!==id);for(const e of m.events)e.mediaIds=e.mediaIds.filter(x=>x!==id);}await mediaDelete(id);scheduleSave();render();}
function triggerFilePicker(type,id,accept){const p=document.getElementById('filePicker');p.value='';p.dataset.targetType=type;p.dataset.targetId=id;p.dataset.accept=accept;p.accept=accept==='image'?'image/*':accept==='audio'?'audio/*':'image/*,audio/*';p.click();}
function toDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob);});}
async function exportBackup(){try{const mediaIds=new Set();for(const c of state.categories)for(const q of c.questions)q.mediaIds.forEach(id=>mediaIds.add(id));for(const m of state.months){m.mediaIds.forEach(id=>mediaIds.add(id));for(const e of m.events)e.mediaIds.forEach(id=>mediaIds.add(id));}const media=[];for(const id of mediaIds){const blob=await mediaGet(id);if(blob)media.push({id,name:blob.name||'file',type:blob.type||'application/octet-stream',data:await toDataURL(blob)});}const payload={format:'yearbook-note-backup',version:3,exportedAt:new Date().toISOString(),state,media};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});downloadBlob(blob,`연말결산_${state.year}_백업.json`);setSaveText('백업 파일을 만들었어요');}catch(e){alert('백업을 만들지 못했어: '+e.message);}}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function importBackupFile(file){try{const data=JSON.parse(await file.text());if(data.format!=='yearbook-note-backup'||!data.state)throw new Error('연말결산 백업 파일이 아니야.');if(!confirm('현재 기록을 백업 파일 내용으로 바꿀까? 현재 기록은 먼저 별도 백업해두는 걸 추천해.'))return;state={...makeInitial(),...data.state};for(const item of data.media||[]){const response=await fetch(item.data);const blob=await response.blob();await mediaPut(item.id,blob,item.name);}saveState();render();alert('백업을 불러왔어!');}catch(e){alert('백업을 불러오지 못했어: '+e.message);}}
function loadImage(blob){return new Promise((resolve)=>{const url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);resolve(null)};img.src=url;});}
function roundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}
function wrapCanvas(ctx,text,maxWidth){const out=[];for(const para of String(text||'').split('\n')){if(!para){out.push('');continue;}let line='';for(const ch of para){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){out.push(line);line=ch;}else line=test;}out.push(line);}return out;}
async function saveImage(){const btn=document.querySelector('[data-action="save-image"]');if(btn){btn.disabled=true;btn.textContent='이미지 만드는 중…';}try{const bg=getComputedStyle(document.body),paper=bg.getPropertyValue('--paper').trim()||'#fffdf8',accent=bg.getPropertyValue('--accent').trim()||'#c8795b',accent2=bg.getPropertyValue('--accent2').trim()||'#e8a58a',ink=bg.getPropertyValue('--ink').trim()||'#403a35',muted=bg.getPropertyValue('--muted').trim()||'#93877b',line=bg.getPropertyValue('--line').trim()||'#e9dfd2';const cards=[];for(const c of activeCats())for(const q of c.questions.filter(q=>q.enabled&&(q.answer.trim()||q.mediaIds.length||q.rating))){cards.push({title:q.title,sub:c.name,text:q.kind==='rating'?`⭐ ${q.rating} / 5`:q.answer,mediaIds:q.mediaIds||[]});}for(const m of state.months){const text=[m.title,m.story,m.good?`좋았던 순간: ${m.good}`:'',m.hard?`힘들었던 일: ${m.hard}`:'',m.lesson?`배운 것: ${m.lesson}`:'',m.mood?`분위기: ${m.mood}`:'',...m.events.map(e=>`${e.date||''} ${e.title}\n${e.note||''}`)].filter(Boolean).join('\n\n');cards.push({title:`${m.month}월의 기록`,sub:'MONTHLY JOURNAL',text:text||'아직 비어 있는 페이지',mediaIds:[...(m.mediaIds||[]),...m.events.flatMap(e=>e.mediaIds||[])],isMonth:true});}
const W=1800,pad=85,gap=34,colW=(W-pad*2-gap)/2,topStart=pad+250,maxPageH=11000;let pages=[{cards:[],ys:[topStart,topStart]}];
for(const c of cards){const measure=document.createElement('canvas').getContext('2d');measure.font='34px -apple-system, BlinkMacSystemFont, sans-serif';const lines=wrapCanvas(measure,c.text||'기록 없음',colW-70);let img=null;for(const id of c.mediaIds){const blob=await mediaGet(id);if(blob&&blob.type.startsWith('image/')){img=await loadImage(blob);if(img)break;}}const imageHeight=img?Math.min(360,(colW-70)*(img.height/img.width)):0;const groups=[];for(let i=0;i<lines.length;i+=28)groups.push(lines.slice(i,i+28));if(!groups.length)groups.push(['']);for(let part=0;part<groups.length;part++){const partImg=part===0?img:null;const textHeight=groups[part].length*48;const ih=partImg?Math.min(360,(colW-70)*(partImg.height/partImg.width)):0;const h=98+textHeight+(partImg?ih+22:0)+45;let pg=pages[pages.length-1];let col=pg.ys[0]<=pg.ys[1]?0:1;if(pg.ys[col]+h+pad/2>maxPageH){const other=1-col;if(pg.ys[other]+h+pad/2<=maxPageH)col=other;else{pages.push({cards:[],ys:[topStart,topStart]});pg=pages[pages.length-1];col=0;}}const title=groups.length>1?`${c.title} (${part+1}/${groups.length})`:c.title;pg.cards.push({...c,title,col,x:pad+col*(colW+gap),y:pg.ys[col],w:colW,h,lines:groups[part],img:partImg});pg.ys[col]+=h+gap;}}
const files=[];for(let pageIndex=0;pageIndex<pages.length;pageIndex++){const pg=pages[pageIndex];const H=Math.ceil(Math.max(...pg.ys)+pad/2);const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');ctx.fillStyle=bg.getPropertyValue('--bg').trim()||'#f5eee5';ctx.fillRect(0,0,W,H);ctx.fillStyle=accent;ctx.font='bold 25px -apple-system, BlinkMacSystemFont, sans-serif';ctx.textAlign='center';ctx.fillText(`MY YEARBOOK  ·  ${state.year}${pages.length>1?`  ·  PAGE ${pageIndex+1}/${pages.length}`:''}`,W/2,pad+14);ctx.fillStyle=ink;ctx.font='bold 78px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText(`${state.year} 연말결산`,W/2,pad+108);ctx.fillStyle=muted;ctx.font='30px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText(state.oneLine||state.title,W/2,pad+165);ctx.strokeStyle=line;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pad,pad+205);ctx.lineTo(W-pad,pad+205);ctx.stroke();ctx.textAlign='left';for(const c of pg.cards){roundRect(ctx,c.x,c.y,c.w,c.h,25,paper,line);roundRect(ctx,c.x,c.y,c.w,68,25,accent2,null);ctx.fillStyle='white';ctx.font='bold 30px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText(c.title.slice(0,34),c.x+28,c.y+45);ctx.fillStyle=muted;ctx.font='20px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText(c.sub,c.x+28,c.y+93);ctx.fillStyle=ink;ctx.font='34px -apple-system, BlinkMacSystemFont, sans-serif';let ty=c.y+143;for(const lineText of c.lines){ctx.fillText(lineText,c.x+28,ty);ty+=48;}if(c.img){const maxW=c.w-56,maxH=360,scale=Math.min(maxW/c.img.width,maxH/c.img.height),iw=c.img.width*scale,ih=c.img.height*scale;roundRect(ctx,c.x+28,ty+12,iw,ih,15,'#eee',null);ctx.save();ctx.beginPath();ctx.roundRect(c.x+28,ty+12,iw,ih,15);ctx.clip();ctx.drawImage(c.img,c.x+28,ty+12,iw,ih);ctx.restore();}if(c.mediaIds.length){ctx.fillStyle=accent;ctx.font='bold 21px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText(`첨부 파일 ${c.mediaIds.length}개`,c.x+28,c.y+c.h-24);}}ctx.fillStyle=muted;ctx.textAlign='center';ctx.font='22px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText('made with my yearbook note',W/2,H-pad/2);const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('이미지 변환 실패')),'image/png'));files.push(new File([blob],`연말결산_${state.year}${pages.length>1?`_페이지${String(pageIndex+1).padStart(2,'0')}`:''}.png`,{type:'image/png'}));}
if(navigator.canShare&&navigator.canShare({files})&&navigator.share){await navigator.share({files,title:`${state.year} 연말결산`});}else{for(const file of files)downloadBlob(file,file.name);alert(files.length>1?`${files.length}장의 이미지로 나눠 저장했어.`:'이미지를 저장했어. iPad에서는 다운로드 항목 또는 공유 메뉴에서 사진 앱에 저장해줘.');}}
catch(e){alert('이미지를 만들지 못했어: '+e.message);}finally{if(btn){btn.disabled=false;btn.textContent='↧ 이미지로 저장';}}}
// Event delegation keeps controls reliable on touch devices.
document.addEventListener('click',async ev=>{const btn=ev.target.closest('[data-view],[data-action]');if(!btn)return;if(btn.dataset.view){currentView=btn.dataset.view;currentCategory=btn.dataset.category||currentCategory;if(currentView==='category'&&!currentCategory)currentCategory=activeCats()[0]?.id||'';render();window.scrollTo({top:0,behavior:'smooth'});return;}const a=btn.dataset.action;
if(a==='close-modal'){if(ev.target===btn||btn.classList.contains('tiny-btn'))document.getElementById('modalRoot').innerHTML='';return;}
if(a==='add-question'){addQuestionModal(btn.dataset.category);return;}if(a==='add-category'){addCategoryModal();return;}if(a==='submit-question'){const form=document.getElementById('questionForm');if(!form.reportValidity())return;const fd=new FormData(form),cat=findCat(fd.get('category'));if(cat){cat.questions.push({id:uid(),title:fd.get('title'),enabled:true,kind:fd.get('kind'),hint:fd.get('hint'),answer:'',rating:0,mediaIds:[]});scheduleSave();document.getElementById('modalRoot').innerHTML='';render();}return;}
if(a==='submit-category'){const form=document.getElementById('categoryForm');if(!form.reportValidity())return;const fd=new FormData(form);const id=uid();state.categories.push({id,name:fd.get('name'),emoji:fd.get('emoji')||'✨',desc:fd.get('desc')||'',enabled:true,questions:[]});currentView='category';currentCategory=id;scheduleSave();document.getElementById('modalRoot').innerHTML='';render();return;}
if(a==='edit-question'){const found=findQ(btn.dataset.question);if(!found)return;showModal('질문 편집',`<form id="editQuestionForm"><div class="form-row"><label>질문 내용</label><input class="form-input" name="title" required value="${esc(found.q.title)}"></div><div class="form-row"><label>답변 형식</label><select class="form-input" name="kind"><option value="text" ${found.q.kind==='text'?'selected':''}>긴 글 / 자유 서술</option><option value="short" ${found.q.kind==='short'?'selected':''}>짧은 한 줄</option><option value="rating" ${found.q.kind==='rating'?'selected':''}>별점 (0~5점)</option></select></div><input type="hidden" name="id" value="${esc(found.q.id)}"></form><button class="btn danger" data-action="delete-question" data-question="${esc(found.q.id)}">질문 삭제</button>`,`<button class="btn ghost" data-action="close-modal">취소</button><button class="btn primary" data-action="save-edit-question">저장</button>`);return;}
if(a==='save-edit-question'){const f=document.getElementById('editQuestionForm');if(!f.reportValidity())return;const fd=new FormData(f),found=findQ(fd.get('id'));if(found){found.q.title=fd.get('title');found.q.kind=fd.get('kind');scheduleSave();document.getElementById('modalRoot').innerHTML='';render();}return;}
if(a==='delete-question'){const found=findQ(btn.dataset.question);if(found&&confirm('이 질문과 답변을 완전히 삭제할까?')){for(const id of found.q.mediaIds)await mediaDelete(id);found.cat.questions=found.cat.questions.filter(q=>q.id!==found.q.id);scheduleSave();document.getElementById('modalRoot').innerHTML='';render();}return;}
if(a==='toggle-question'){const found=findQ(btn.dataset.question);if(found){found.q.enabled=!found.q.enabled;scheduleSave();render();}return;}
if(a==='toggle-category'){const cat=findCat(btn.dataset.category);if(cat){cat.enabled=!cat.enabled;scheduleSave();render();}return;}
if(a==='move-question'){const cat=findCat(btn.dataset.category);if(cat){moveItem(cat.questions,btn.dataset.question,Number(btn.dataset.dir));scheduleSave();render();}return;}
if(a==='move-category'){moveItem(state.categories,btn.dataset.category,Number(btn.dataset.dir));scheduleSave();render();return;}
if(a==='edit-category'){const cat=findCat(btn.dataset.category);if(cat)editCategoryModal(cat);return;}
if(a==='save-edit-category'){const f=document.getElementById('editCategoryForm');if(!f.reportValidity())return;const fd=new FormData(f),cat=findCat(fd.get('id'));if(cat){cat.name=fd.get('name');cat.emoji=fd.get('emoji')||'✨';cat.desc=fd.get('desc')||'';scheduleSave();document.getElementById('modalRoot').innerHTML='';render();}return;}
if(a==='delete-category'){const cat=findCat(btn.dataset.category);if(cat&&confirm(`'${cat.name}' 카테고리와 그 안의 답변을 삭제할까?`)){for(const q of cat.questions)for(const id of q.mediaIds||[])await mediaDelete(id);state.categories=state.categories.filter(c=>c.id!==cat.id);if(currentCategory===cat.id){currentView='customize';currentCategory='';}scheduleSave();render();}return;}
if(a==='set-theme'){state.theme=btn.dataset.theme;scheduleSave();render();return;}
if(a==='all-categories'){state.categories.forEach(c=>c.enabled=btn.dataset.mode==='on');scheduleSave();render();return;}
if(a==='select-month'){selectedMonth=Number(btn.dataset.month);render();return;}
if(a==='add-event'){eventModal(Number(btn.dataset.month));return;}
if(a==='edit-event'){const m=state.months.find(m=>m.month===Number(btn.dataset.month)),e=m?.events.find(e=>e.id===btn.dataset.event);if(m&&e)eventModal(m.month,e);return;}
if(a==='submit-event'){const f=document.getElementById('eventForm');if(!f.reportValidity())return;const fd=new FormData(f),m=state.months.find(m=>m.month===Number(fd.get('month')));if(m){let e=m.events.find(e=>e.id===fd.get('eventId'));if(!e){e={id:uid(),date:'',title:'',note:'',mediaIds:[]};m.events.push(e);}e.date=fd.get('date');e.title=fd.get('title');e.note=fd.get('note');scheduleSave();document.getElementById('modalRoot').innerHTML='';render();}return;}
if(a==='delete-event'){const m=state.months.find(m=>m.month===Number(btn.dataset.month));if(m&&confirm('이 사건 기록을 삭제할까?')){m.events=m.events.filter(e=>e.id!==btn.dataset.event);scheduleSave();render();}return;}
if(a==='attach'){triggerFilePicker(btn.dataset.targetType,btn.dataset.targetId,btn.dataset.accept);return;}
if(a==='remove-media'){await removeMedia(btn.dataset.media);return;}
if(a==='export-backup'||a==='quick-backup'){await exportBackup();return;}
if(a==='import-backup'){document.getElementById('backupPicker').click();return;}
if(a==='save-image'){await saveImage();return;}
if(a==='reset'){if(confirm('모든 텍스트와 첨부 파일 연결을 초기화할까? 이 작업은 되돌릴 수 없어.')){localStorage.removeItem(STORE_KEY);state=makeInitial();for(const id of objectUrls.keys())URL.revokeObjectURL(objectUrls.get(id));objectUrls.clear();try{const db=await openDB();await new Promise(resolve=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').clear();tx.oncomplete=resolve;});}catch(e){}currentView='home';selectedMonth=1;render();}return;}
});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.answer){const found=findQ(el.dataset.answer);if(found)found.q.answer=el.value;scheduleSave();}if(el.dataset.state){state[el.dataset.state]=el.dataset.state==='year'?Number(el.value):el.value;scheduleSave();}if(el.dataset.month&&el.dataset.key){const m=state.months.find(m=>m.month===Number(el.dataset.month));if(m)m[el.dataset.key]=el.value;scheduleSave();}if(el.dataset.rating){const found=findQ(el.dataset.rating);if(found){found.q.rating=Number(el.value);const label=document.querySelector(`[data-rating-label="${CSS.escape(el.dataset.rating)}"]`);if(label)label.textContent=el.value;scheduleSave();}}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.categoryToggle){const c=findCat(el.dataset.categoryToggle);if(c){c.enabled=el.checked;scheduleSave();render();}}if(el.id==='filePicker'&&el.files.length){attachFiles(el.dataset.targetType,el.dataset.targetId,el.dataset.accept,el.files);}if(el.id==='backupPicker'&&el.files[0])importBackupFile(el.files[0]);});
loadState();render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
</script>
